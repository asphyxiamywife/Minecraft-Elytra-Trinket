plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
	id "com.modrinth.minotaur" version "2.+"
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	["fabric-entity-events-v1", "fabric-rendering-v1"].each {
		module -> implementation(fabricApi.module(module, project.fabric_api_version))
	}
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}" // Required for testing because Trinkets expects "fabric-api" to be present.

	// Trinkets Updated
	implementation "eu.pb4:trinkets:${project.trinkets_api_version}"
}

processResources {
	filesMatching("*.json") {
		expand project.properties
	}
}

processClientResources {
	filesMatching("*.json") {
		expand project.properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as Integer
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.valueOf("VERSION_${project.java_version}")
	targetCompatibility = JavaVersion.valueOf("VERSION_${project.java_version}")
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.id}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.id
			from components.java
		}
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_id
	versionName = "Elytra Trinket v${project.version}"
	uploadFile = jar
	additionalFiles = [sourcesJar]
	dependencies {
		required.project "fabric-api"
		required.project "trinkets-updated"
	}
	syncBodyFrom = rootProject.file("README.md").text
}

tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
